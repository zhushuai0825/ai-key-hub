<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>漫剧工作室</title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./knowledge.css" />
</head>
<body class="module knowledge-page drama-page">
  <header class="kb-bar">
    <a class="module-back" href="/hub.html">返回指挥台</a>
    <div class="module-title">
      <strong>漫剧工作室</strong>
      <span id="headerHint">选择或新建项目</span>
    </div>
    <button class="btn btn-solid" id="newProjectBtn" type="button">新建项目</button>
  </header>

  <main class="drama-flow">
    <!-- ① 项目列表 -->
    <section id="viewList" class="drama-view">
      <div class="drama-list-head">
        <h1>全部剧本</h1>
        <p>选一个继续，或新建后用对话写大纲</p>
      </div>
      <div id="projectGrid" class="drama-grid"></div>
    </section>

    <!-- ② 项目内流程 -->
    <section id="viewWork" class="drama-view" hidden>
      <div class="drama-work-bar">
        <button type="button" class="btn" id="backListBtn">← 全部项目</button>
        <div class="drama-work-title">
          <strong id="workTitle">—</strong>
          <span id="workMeta">—</span>
        </div>
        <div class="drama-work-actions">
          <button type="button" class="btn" id="exportLmdBtn">导出 ZIP</button>
          <button type="button" class="btn" id="deleteProjectBtn">删除</button>
        </div>
      </div>

      <nav class="drama-steps" aria-label="创作步骤">
        <button type="button" class="drama-step is-active" data-step="outline">1 对话写大纲</button>
        <button type="button" class="drama-step" data-step="script">2 生成剧本</button>
        <button type="button" class="drama-step" data-step="assets">3 识别数据</button>
        <button type="button" class="drama-step" data-step="export">4 导出</button>
      </nav>

      <div class="drama-step-panel is-active" data-panel="outline">
        <div class="drama-outline-layout">
          <div class="drama-outline-chat-col">
            <div id="chatLog" class="drama-chat"></div>
            <form id="chatForm" class="drama-chat-form">
              <input id="chatInput" type="text" placeholder="说你的故事想法，例如：ENFP 开咖啡店遇到 ISTJ…" autocomplete="off" />
              <button class="btn btn-solid" type="submit" id="chatSendBtn">发送</button>
            </form>
          </div>
          <article class="drama-outline-live">
            <header>
              <strong>当前大纲</strong>
              <span id="outlineStatus" class="form-hint">还没有大纲</span>
            </header>
            <div id="outlineLive" class="drama-preview">对话几轮后，这里会实时显示整理好的大纲。</div>
          </article>
        </div>
        <div class="drama-step-footer">
          <span class="form-hint">确认大纲没问题后，再去生成剧本</span>
          <button type="button" class="btn btn-solid" id="gotoScriptBtn" disabled>大纲完成，去生成剧本 →</button>
        </div>
      </div>

      <div class="drama-step-panel" data-panel="script" hidden>
        <article class="drama-result">
          <header>
            <strong>当前大纲</strong>
            <button type="button" class="btn" id="backOutlineBtn">改大纲</button>
          </header>
          <p id="outlinePreview" class="drama-preview">（还没有大纲）</p>
        </article>
        <div class="drama-primary-action">
          <label class="drama-ep-count">集数
            <input id="episodeCountInput" type="number" min="1" max="12" value="3" />
          </label>
          <button type="button" class="btn btn-solid" id="generateScriptsBtn">生成剧本</button>
        </div>
        <div id="scriptList" class="drama-result-list"></div>
        <div class="drama-step-footer">
          <button type="button" class="btn btn-solid" id="gotoAssetsBtn" disabled>剧本完成，去识别数据 →</button>
        </div>
      </div>

      <div class="drama-step-panel" data-panel="assets" hidden>
        <div class="drama-primary-action">
          <p class="form-hint">从剧本里自动抽出人物、场景、道具</p>
          <button type="button" class="btn btn-solid" id="extractAllBtn">一键识别</button>
        </div>
        <div class="drama-asset-cols">
          <section>
            <h3>人物 <span id="charCount">0</span></h3>
            <div id="characterList"></div>
          </section>
          <section>
            <h3>场景 <span id="sceneCount">0</span></h3>
            <div id="sceneList"></div>
          </section>
          <section>
            <h3>道具 <span id="propCount">0</span></h3>
            <div id="propList"></div>
          </section>
        </div>
        <div class="drama-step-footer">
          <button type="button" class="btn btn-solid" id="gotoExportBtn">去导出 →</button>
        </div>
      </div>

      <div class="drama-step-panel" data-panel="export" hidden>
        <div class="drama-export-box">
          <h2>导出到 LocalMiniDrama</h2>
          <p>打包为 version 1.5 的 ZIP（含 project.json），可直接导入 LocalMiniDrama。</p>
          <button type="button" class="btn btn-solid" id="exportLmdBtn2">下载 ZIP</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="./drama.js"></script>
</body>
</html>
